<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1026">
<title>La Guerre des Gaz</title>
<link rel="icon" href="assets/icone.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="devbar">
  <span class="devtitle">La Guerre des Gaz</span>
  <div class="devbtns">
    <button data-mode="browser">🖥️ Navigateur</button>
    <button data-mode="phone">📱 Téléphone Android</button>
    <button id="rotateBtn">🔄 Tourner</button>
  </div>
</div>

<div id="stage">
  <div id="device">
    <div id="game">
      <canvas id="view"></canvas>
      <div id="vignette"></div>

      <div id="hud" class="hidden">
        <div id="top">
          <div id="hearts"></div>
          <div id="objective"></div>
          <button id="muteBtn" class="round" aria-label="Son">🔊</button>
          <button id="pauseBtn" class="round" aria-label="Pause">⏸</button>
        </div>
        <div id="radio" class="hidden"><div class="face"><img id="radioImg" src="" alt=""></div><div class="txt"><b id="radioName"></b><p id="radioText"></p></div></div>
        <div id="bossbar" class="hidden"><span id="bossName"></span><div class="bar"><div id="bossFill"></div></div></div>
        <div id="banner" class="hidden"></div>
        <div id="pointer" class="hidden">➤</div>
        <div id="controls">
          <button id="btnMega" class="ctl"><i id="megaFill"></i><span>💨</span><b>MÉGA-PROUT</b></button>
          <button id="btnBlock" class="ctl footOnly"><span>🛡️</span><b>PARER</b></button>
          <button id="btnAtk" class="ctl footOnly"><span>⚔️</span><b>SABRE</b></button>
          <button id="btnJump" class="ctl footOnly"><span>🌀</span><b>SAUT</b></button>
          <button id="btnAct" class="ctl hidden"><span>🚀</span><b id="actLabel">MONTER</b></button>
        </div>
        <div id="tip" class="hidden"></div>
        <div id="flightHelp" class="hidden">👆 Glisse le doigt pour piloter</div>
      </div>

      <div id="joy" class="hidden"><div id="joyKnob"></div></div>
      <div id="flash"></div>
      <div id="hurtFx"></div>
      <div id="toast" class="hidden"></div>
      <div id="screens"></div>
      <div id="loading"><div class="logo small">La Guerre<br>des Gaz</div><span id="loadText">Chargement de la galaxie…</span><div class="lbar"><div id="loadFill"></div></div></div>
    </div>
    <div id="punch"></div>
  </div>
</div>

<!-- Capacitor : donne accès aux outils de l'appli Android (mises à jour). Sans lui, ils sont introuvables. -->
<script src="lib/capacitor.js"></script>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
